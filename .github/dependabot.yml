version: 2
updates:
  # Minor/patch bumps arrive as one grouped PR per ecosystem instead of a
  # dozen PRs that conflict with each other on the lockfile. Majors stay
  # separate — they're the bumps that break things (e.g. mcp 1.x -> 2.x).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Dockerfile base images (node, python, uv) — pinned tags, so bumpable.
  # Runtime majors (and Python minors) move together with web/.nvmrc and
  # .python-version, which CI tests against — so Dependabot only does
  # patch/minor bumps of them here. node and python come through
  # mirror.gcr.io (see the Dockerfile), where they're named library/node and
  # library/python: the leading wildcard matches either spelling.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "*python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
