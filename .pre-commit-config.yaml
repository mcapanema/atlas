# Two stages, both installed by `make hooks`:
# - pre-commit (fast): lint + format checks only — the checks that have
#   actually bitten us (a migration once shipped with 5 unnoticed lint
#   violations). mypy/pytest stay out so commits stay near-instant.
# - pre-push (thorough): `make pre-push` runs the full CI gate (`make check`)
#   on the commit being pushed, so a PR never goes up red.
#   `git push --no-verify` skips it.
# ponytail: pre-push checks the working tree, guarded to equal the pushed
# commit (pre-commit stashes unstaged edits first; `make pre-push` refuses
# staged ones); untracked files still count. Upgrade path if that bites: run
# `make check` in a throwaway `git worktree add` of $PRE_COMMIT_TO_REF.
default_install_hook_types: [pre-commit, pre-push]
# Hooks without `stages` run at commit time only, not again on push.
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check --force-exclude
        language: system
        types: [python]
      - id: eslint
        name: eslint (web)
        # eslint resolves paths relative to web/, so staged repo-relative
        # filenames can't be passed through — run the whole web lint instead
        # (a few seconds) whenever any web TS file is staged.
        entry: npm --prefix web run lint
        language: system
        files: ^web/.*\.(ts|tsx)$
        pass_filenames: false
      - id: prettier
        name: prettier --check (web)
        # Prettier resolves web/.prettierrc.json per file, so repo-relative
        # staged paths work; web/.prettierignore is NOT consulted from the
        # repo root, hence the explicit exclude mirroring it.
        entry: web/node_modules/.bin/prettier --check --ignore-unknown
        language: system
        files: ^web/
        exclude: ^web/(package-lock\.json|.*\.md|dist/.*|coverage/.*)$
      - id: make-check
        name: make check (full CI gate)
        entry: make pre-push
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
