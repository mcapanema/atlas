services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Forced regardless of .env: the container always opens the bind mount
      # below, which is the same data/atlas.db a local `make dev` uses.
      ATLAS_DATABASE_URL: sqlite+aiosqlite:////app/data/atlas.db
    volumes:
      # ponytail: one database shared with local runs, so one side at a time
      # (SQLite's WAL locks don't cross Docker's VM; the Makefile guards it).
      # On a Linux host the container writes data/ as root; upgrade path is
      # `user: "<host uid>:<host gid>"` here if that bites.
      - ./data:/app/data
